<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>我的个人介绍</title>
<style>
  body {
    font-family: 微软雅黑, sans-serif;
    background: linear-gradient(135deg, #a8edea, #fed6e3);
    margin: 0;
    padding: 40px 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .card {
    background: white;
    padding: 40px 50px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
    max-width: 500px;
    width: 100%;
  }
  h1 {
    color: #333;
    margin-bottom: 10px;
  }
  .intro {
    color: #666;
    font-size: 18px;
    margin-bottom: 30px;
  }
  .hobby {
    display: inline-block;
    background: #ffecd2;
    color: #c76a3c;
    padding: 10px 20px;
    border-radius: 25px;
    margin: 8px;
    font-size: 16px;
  }
  .contact-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 30px;
    background: #4a90e2;
    color: white;
    text-decoration: none;
    border-radius: 25px;
    font-size: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>yy</h1>
    <p class="intro">我正在用AI从零学做网页</p>
    <div>
      <span class="hobby">挣钱</span>
    </div>
    <a href="mailto:你的邮箱@example.com" class="contact-btn">联系我</a>
  </div>
</body>
</html>
